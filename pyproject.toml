[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphkit"
version = "0.1.0"
description = "Find relationships between tables and build BigQuery or Spanner property graphs, with a review UI, Terraform and benchmarks."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["sqlglot>=26"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25"]
spanner = ["google-cloud-spanner>=3.40"]
ui = ["streamlit>=1.40", "pandas"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.30"]
llm = ["google-genai>=1.0"]
chat = ["firebase-admin>=6.5", "google-adk>=2.0", "google-cloud-modelarmor>=0.2"]
notebook = ["bigquery-magics[spanner-graph-notebook]>=0.15", "spanner-graph-notebook>=1.1", "jupyter"]
all = ["graphkit[bigquery,spanner,ui,api,llm,chat]"]
dev = ["graphkit[all]", "pytest"]

[project.scripts]
graphkit = "graphkit.cli:main"
graphkit-chat = "graphkit.chat.__main__:main"

[tool.setuptools.packages.find]
include = ["graphkit*"]

[tool.setuptools.package-data]
"graphkit.ui" = ["vis-network.min.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
